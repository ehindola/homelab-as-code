<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><title>Reaching the internet</title><desc>R1 connects to the home router on its outside interface and to CORE on its inside interface. OSPF exchanges a default route and the VLAN subnets. NAT translates inside addresses to R1&#x27;s outside address.</desc><defs><marker id="m444441" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#444441"/></marker><marker id="m534AB7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#534AB7"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBFAF7"/><text x="60" y="78" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="42" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">Reaching the internet</text><text x="60" y="118" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">OSPF shares the routes, NAT hides the private addresses</text><line x1="60" y1="142" x2="1540" y2="142" stroke="#D3D1C7" stroke-width="1.5"/><text x="60" y="872" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#888780" text-anchor="start" font-weight="400" xml:space="preserve">Lab 1 · Campus network · built in EVE-NG</text><rect x="120" y="180" width="340" height="84" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text x="290.0" y="218.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#2C2C2A" text-anchor="middle" font-weight="700" xml:space="preserve">Home router</text><text x="290.0" y="246.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#5F5E5A" text-anchor="middle" font-weight="400" xml:space="preserve">192.168.1.1 · internet</text><rect x="120" 