<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><title>Campus network lab in EVE-NG</title><desc>Cover image: campus network lab built in EVE-NG, with a small topology diagram.</desc><defs></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBFAF7"/><text x="80" y="250" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="72" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">Campus network lab</text><text x="80" y="330" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="40" fill="#534AB7" text-anchor="start" font-weight="700" xml:space="preserve">Built from scratch in EVE-NG</text><text x="80" y="410" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">Six devices, three VLANs, one routed core,</text><text x="80" y="448" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">and a path to the internet.</text><rect x="80" y="520" width="100" height="40" rx="20.0" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="130.0" y="545" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">VLANs</text><rect x="194" y="520" width="208" height="40" rx="20.0" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="298.0" y="545" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">802.1Q trunks</text><rect x="416" y="520" width="276" height="40" rx="20.0" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="554.0" y="545" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">Inter-VLAN routing</text><rect x="80" y="580" width="86" height="40" rx="20.0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="123.0" y="605" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">OSPF</text><rect x="180" y="580" width="72" height="40" rx="20.0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="216.0" y="605" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">NAT</text><rect x="266" y="580" width="236" height="40" rx="20.0" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="384.0" y="605" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">Troubleshooting</text><text x="80" y="800" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#888780" text-anchor="start" font-weight="400" xml:space="preserve">Lab 1 of 6 · Homelab series</text><rect x="1100" y="130" width="200" height="60" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text x="1200.0" y="167.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#2C2C2A" text-anchor="middle" font-weight="700" xml:space="preserve">Internet</text><rect x="1100" y="260" width="200" height="70" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="1200.0" y="304.1" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">R1</text><rect x="1070" y="410" width="260" height="70" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="1200.0" y="454.1" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">CORE</text><rect x="900" y="570" width="220" height="70" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="1010.0" y="614.1" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">ACC1</text><rect x="1280" y="570" width="220" height="70" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="1390.0" y="614.1" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">ACC2</text><rect x="900" y="720" width="220" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="1010.0" y="764.1" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">PC1</text><rect x="1280" y="720" width="220" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="1390.0" y="764.1" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">SRV1</text><path d="M1200 190 L1200 260" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><path d="M1200 330 L1200 410" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><path d="M1140 480 L1140 525 L1010 525 L1010 570" fill="none" stroke="#444441" stroke-width="4" stroke-linejoin="round"/><path d="M1260 480 L1260 525 L1390 525 L1390 570" fill="none" stroke="#444441" stroke-width="4" stroke-linejoin="round"/><path d="M1010 640 L1010 720" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><path d="M1390 640 L1390 720" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/></svg>