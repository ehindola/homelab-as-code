<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><title>Troubleshooting: server cannot reach its gateway</title><desc>Before the fix, ACC2 port e0/1 was in VLAN 10 so SRV1 could not reach its gateway in VLAN 20. After moving the port to VLAN 20 the ping succeeds.</desc><defs></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBFAF7"/><text x="60" y="78" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="42" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">Troubleshooting: server cannot reach its gateway</text><text x="60" y="118" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">An access port in the wrong VLAN</text><line x1="60" y1="142" x2="1540" y2="142" stroke="#D3D1C7" stroke-width="1.5"/><text x="60" y="872" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#888780" text-anchor="start" font-weight="400" xml:space="preserve">Lab 1 · Campus network · built in EVE-NG</text><rect x="60" y="190" width="720" height="440" rx="16" fill="#FFFFFF" stroke="#A32D2D" stroke-width="2"/><rect x="84" y="170" width="113" height="40" rx="20.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/><text x="140.5" y="195" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#501313" text-anchor="middle" font-weight="700" xml:space="preserve">Before</text><rect x="90" y="250" width="190" height="96" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="185.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">SRV1</text><text x="185.0" y="322.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#0F6E56" text-anchor="middle" font-weight="400" xml:space="preserve">10.10.20.10</text><rect x="325" y="250" width="190" height="96" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/><text x="420.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#501313" text-anchor="middle" font-weight="700" xml:space="preserve">ACC2</text><text x="420.0" y="322.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#A32D2D" text-anchor="middle" font-weight="400" xml:space="preserve">e0/1 in VLAN 10</text><rect x="560" y="250" width="190" height="96" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="655.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">CORE</text><text x="655.0" y="322.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">Vlan20 10.10.20.1</text><path d="M280 298 L325 298" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><path d="M515 298 L560 298" fill="none" stroke="#444441" stroke-width="4" stroke-linejoin="round"/><rect x="90" y="376" width="660" height="117" rx="10" fill="#2C2C2A"/><text x="112" y="414" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">root@ubuntu:~# ping -c 3 10.10.20.1</text><text x="112" y="443" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">Destination Host Unreachable</text><text x="112" y="472" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">3 transmitted, 0 received</text><text x="90" y="540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">SRV1&#x27;s ARP request for 10.10.20.1 goes out in</text><text x="90" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">VLAN 10, where no device owns that address.</text><rect x="820" y="190" width="720" height="440" rx="16" fill="#FFFFFF" stroke="#3B6D11" stroke-width="2"/><rect x="844" y="170" width="100" height="40" rx="20.0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/><text x="894.0" y="195" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#173404" text-anchor="middle" font-weight="700" xml:space="preserve">After</text><rect x="850" y="250" width="190" height="96" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="945.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">SRV1</text><text x="945.0" y="322.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#0F6E56" text-anchor="middle" font-weight="400" xml:space="preserve">10.10.20.10</text><rect x="1085" y="250" width="190" height="96" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/><text x="1180.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#173404" text-anchor="middle" font-weight="700" xml:space="preserve">ACC2</text><text x="1180.0" y="322.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#3B6D11" text-anchor="middle" font-weight="400" xml:space="preserve">e0/1 in VLAN 20</text><rect x="1320" y="250" width="190" height="96" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="1415.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">CORE</text><text x="1415.0" y="322.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">Vlan20 10.10.20.1</text><path d="M1040 298 L1085 298" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><path d="M1275 298 L1320 298" fill="none" stroke="#444441" stroke-width="4" stroke-linejoin="round"/><rect x="850" y="376" width="660" height="117" rx="10" fill="#2C2C2A"/><text x="872" y="414" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">root@ubuntu:~# ping -c 3 10.10.20.1</text><text x="872" y="443" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">64 bytes from 10.10.20.1: time=1.08 ms</text><text x="872" y="472" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">3 transmitted, 3 received, 0% loss</text><text x="850" y="540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">SRV1 and its gateway are in the same VLAN,</text><text x="850" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">so ARP is answered and the ping replies.</text><text x="60" y="690" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">How it was found</text><text x="60" y="724" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">show vlan brief on ACC2 listed Et0/1 under</text><text x="60" y="752" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">10 USERS, with no ports in 20 SERVERS.</text><text x="60" y="796" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">ACC2 had been given ACC1&#x27;s access-port config.</text><rect x="820" y="668" width="720" height="120" rx="10" fill="#2C2C2A"/><text x="842" y="706" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">ACC2(config)# interface e0/1</text><text x="842" y="736" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">ACC2(config-if)# switchport mode access</text><text x="842" y="766" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">ACC2(config-if)# switchport access vlan 20</text></svg>