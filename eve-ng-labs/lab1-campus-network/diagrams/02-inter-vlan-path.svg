<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><title>How PC1 reaches SRV1</title><desc>A packet travels from PC1 through ACC1 over a trunk to CORE, is routed from VLAN 10 to VLAN 20, then travels over a trunk to ACC2 and on to SRV1.</desc><defs><marker id="m444441" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#444441"/></marker><marker id="m534AB7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#534AB7"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBFAF7"/><text x="60" y="78" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="42" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">How PC1 reaches SRV1</text><text x="60" y="118" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">Inter-VLAN routing: the frame changes VLAN at the layer 3 switch</text><line x1="60" y1="142" x2="1540" y2="142" stroke="#D3D1C7" stroke-width="1.5"/><text x="60" y="872" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#888780" text-anchor="start" font-weight="400" xml:space="preserve">Lab 1 · Campus network · built in EVE-NG</text><rect x="70" y="300" width="730" height="290" rx="16" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="8 6"/><rect x="800" y="300" width="730" height="290" rx="16" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="8 6"/><text x="96" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#633806" text-anchor="start" font-weight="700" xml:space="preserve">VLAN 10 · USERS · 10.10.10.0/24</text><text x="1504" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#0C447C" text-anchor="end" font-weight="700" xml:space="preserve">VLAN 20 · SERVERS · 10.10.20.0/24</text><rect x="100" y="400" width="220" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="210.0" y="446.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">PC1</text><text x="210.0" y="474.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#0F6E56" text-anchor="middle" font-weight="400" xml:space="preserve">10.10.10.50</text><rect x="400" y="400" width="220" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="510.0" y="446.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">ACC1</text><text x="510.0" y="474.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">Access switch</text><rect x="690" y="400" width="220" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="800.0" y="446.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">CORE</text><text x="800.0" y="474.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">Routes here</text><rect x="980" y="400" width="220" height="100" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="1090.0" y="446.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">ACC2</text><text x="1090.0" y="474.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">Access switch</text><rect x="1280" y="400" width="220" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="1390.0" y="446.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">SRV1</text><text x="1390.0" y="474.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#0F6E56" text-anchor="middle" font-weight="400" xml:space="preserve">10.10.20.10</text><path d="M326 450 L392 450" fill="none" stroke="#444441" stroke-width="3" stroke-linejoin="round" marker-end="url(#m444441)"/><text x="360.0" y="540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#2C2C2A" text-anchor="middle" font-weight="400" xml:space="preserve">access port</text><path d="M626 450 L682 450" fill="none" stroke="#444441" stroke-width="3" stroke-linejoin="round" marker-end="url(#m444441)"/><text x="655.0" y="540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#2C2C2A" text-anchor="middle" font-weight="400" xml:space="preserve">trunk, tag 10</text><path d="M916 450 L972 450" fill="none" stroke="#444441" stroke-width="3" stroke-linejoin="round" marker-end="url(#m444441)"/><text x="945.0" y="540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#2C2C2A" text-anchor="middle" font-weight="400" xml:space="preserve">trunk, tag 20</text><path d="M1206 450 L1272 450" fill="none" stroke="#444441" stroke-width="3" stroke-linejoin="round" marker-end="url(#m444441)"/><text x="1240.0" y="540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#2C2C2A" text-anchor="middle" font-weight="400" xml:space="preserve">access port</text><text x="800" y="250" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="20" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">Vlan10 10.10.10.1  →  Vlan20 10.10.20.1</text><path d="M800 262 L800 392" fill="none" stroke="#534AB7" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#m534AB7)"/><text x="100" y="660" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">1  PC1 sees that 10.10.20.10 is outside its subnet, so it sends the packet to its gateway, 10.10.10.1.</text><text x="100" y="704" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">2  ACC1 puts the frame in VLAN 10 and carries it up the trunk with an 802.1Q tag of 10.</text><text x="100" y="748" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">3  CORE receives it on interface Vlan10, looks up 10.10.20.0/24, and sends it out of interface Vlan20.</text><text x="100" y="792" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">4  The frame goes down the other trunk tagged 20, and ACC2 delivers it untagged to SRV1.</text></svg>