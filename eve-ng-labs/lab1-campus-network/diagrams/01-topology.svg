<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><title>Lab 1 topology</title><desc>Internet connects to router R1, then to layer 3 switch CORE, which trunks to access switches ACC1 and ACC2. PC1 is in VLAN 10 on ACC1 and SRV1 is in VLAN 20 on ACC2.</desc><defs></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBFAF7"/><text x="60" y="78" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="42" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">Lab 1 topology</text><text x="60" y="118" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">Campus network with VLANs, trunks, inter-VLAN routing, OSPF and NAT</text><line x1="60" y1="142" x2="1540" y2="142" stroke="#D3D1C7" stroke-width="1.5"/><text x="60" y="872" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#888780" text-anchor="start" font-weight="400" xml:space="preserve">Lab 1 · Campus network · built in EVE-NG</text><rect x="660" y="160" width="280" height="64" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text x="800.0" y="199.7" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#2C2C2A" text-anchor="middle" font-weight="700" xml:space="preserve">Internet (Cloud0)</text><rect x="660" y="280" width="280" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="800.0" y="318.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">R1</text><text x="800.0" y="346.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">Edge router · NAT</text><rect x="620" y="450" width="360" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="800.0" y="488.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">CORE</text><text x="800.0" y="516.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">Layer 3 switch · VLAN gateways</text><rect x="260" y="600" width="300" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="410.0" y="638.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">ACC1</text><text x="410.0" y="666.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">Access switch</text><rect x="1040" y="600" width="300" height="84" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="1190.0" y="638.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">ACC2</text><text x="1190.0" y="666.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">Access switch</text><rect x="260" y="750" width="300" height="84" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="410.0" y="788.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">PC1</text><text x="410.0" y="816.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#0F6E56" text-anchor="middle" font-weight="400" xml:space="preserve">Windows 10 · 10.10.10.50</text><rect x="1040" y="750" width="300" height="84" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="1190.0" y="788.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="26" fill="#04342C" text-anchor="middle" font-weight="700" xml:space="preserve">SRV1</text><text x="1190.0" y="816.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#0F6E56" text-anchor="middle" font-weight="400" xml:space="preserve">Ubuntu Server · 10.10.20.10</text><path d="M800 224 L800 280" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><path d="M800 364 L800 450" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><path d="M720 534 L720 567 L410 567 L410 600" fill="none" stroke="#444441" stroke-width="4" stroke-linejoin="round"/><path d="M880 534 L880 567 L1190 567 L1190 600" fill="none" stroke="#444441" stroke-width="4" stroke-linejoin="round"/><path d="M410 684 L410 750" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><path d="M1190 684 L1190 750" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><text x="816" y="260" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">e0/0 · DHCP from home router</text><text x="816" y="388" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">e0/1 · 10.10.0.1</text><text x="816" y="414" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#534AB7" text-anchor="start" font-weight="700" xml:space="preserve">10.10.0.0/30 · OSPF area 0</text><text x="816" y="440" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">e0/0 · 10.10.0.2</text><text x="704" y="556" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#5F5E5A" text-anchor="end" font-weight="400" xml:space="preserve">e0/1</text><text x="565" y="556" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#534AB7" text-anchor="middle" font-weight="700" xml:space="preserve">802.1Q trunk</text><text x="426" y="590" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">e0/0</text><text x="896" y="556" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">e0/2</text><text x="1035" y="556" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#534AB7" text-anchor="middle" font-weight="700" xml:space="preserve">802.1Q trunk</text><text x="1206" y="590" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">e0/0</text><text x="426" y="724" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">e0/1 · access VLAN 10</text><text x="1206" y="724" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="17" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">e0/1 · access VLAN 20</text><rect x="1090" y="170" width="450" height="196" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/><text x="1114" y="206" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">VLANs (gateways on CORE)</text><text x="1114" y="246" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">VLAN 10</text><text x="1214" y="246" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">USERS</text><text x="1330" y="246" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">10.10.10.0/24</text><text x="1114" y="282" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">VLAN 20</text><text x="1214" y="282" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">SERVERS</text><text x="1330" y="282" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">10.10.20.0/24</text><text x="1114" y="318" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">VLAN 99</text><text x="1214" y="318" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">MGMT</text><text x="1330" y="318" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">10.10.99.0/24</text><rect x="60" y="170" width="330" height="150" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.5"/><rect x="84" y="194" width="26" height="26" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="124" y="214" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">Network device</text><rect x="84" y="234" width="26" height="26" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/><text x="124" y="254" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">Host</text><rect x="84" y="274" width="26" height="26" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/><text x="124" y="294" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">External network</text></svg>