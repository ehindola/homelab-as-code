<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><title>Lab series roadmap</title><desc>Six labs: campus network, core services, perimeter security, site-to-site VPN, AAA and wireless, and multi-vendor routing. Lab 1 is complete.</desc><defs></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBFAF7"/><text x="60" y="78" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="42" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">Lab series roadmap</text><text x="60" y="118" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">Each lab extends the one before it into a single enterprise-style network</text><line x1="60" y1="142" x2="1540" y2="142" stroke="#D3D1C7" stroke-width="1.5"/><text x="60" y="872" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#888780" text-anchor="start" font-weight="400" xml:space="preserve">Lab 1 · Campus network · built in EVE-NG</text><rect x="60" y="190" width="460" height="290" rx="16" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/><text x="90" y="242" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#3B6D11" text-anchor="start" font-weight="700" xml:space="preserve">Lab 1</text><text x="90" y="284" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="30" fill="#173404" text-anchor="start" font-weight="700" xml:space="preserve">Campus network</text><text x="90" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  VLANs and 802.1Q trunks</text><text x="90" y="378" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  Inter-VLAN routing</text><text x="90" y="416" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  OSPF and NAT</text><rect x="390" y="216" width="80" height="38" rx="19.0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/><text x="430.0" y="239" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#173404" text-anchor="middle" font-weight="700" xml:space="preserve">Done</text><rect x="570" y="190" width="460" height="290" rx="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/><text x="600" y="242" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#5F5E5A" text-anchor="start" font-weight="700" xml:space="preserve">Lab 2</text><text x="600" y="284" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="30" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">Core services</text><text x="600" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  Active Directory and DNS</text><text x="600" y="378" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  DHCP with relay</text><text x="600" y="416" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  Domain-joined client</text><rect x="1080" y="190" width="460" height="290" rx="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/><text x="1110" y="242" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#5F5E5A" text-anchor="start" font-weight="700" xml:space="preserve">Lab 3</text><text x="1110" y="284" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="30" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">Perimeter security</text><text x="1110" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  FortiGate at the edge</text><text x="1110" y="378" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  Firewall policies and NAT</text><text x="1110" y="416" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  DMZ web server</text><rect x="60" y="520" width="460" height="290" rx="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/><text x="90" y="572" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#5F5E5A" text-anchor="start" font-weight="700" xml:space="preserve">Lab 4</text><text x="90" y="614" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="30" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">Second site and VPN</text><text x="90" y="670" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  Branch office</text><text x="90" y="708" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  IPsec site-to-site tunnel</text><text x="90" y="746" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  Routing over the tunnel</text><rect x="570" y="520" width="460" height="290" rx="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/><text x="600" y="572" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#5F5E5A" text-anchor="start" font-weight="700" xml:space="preserve">Lab 5</text><text x="600" y="614" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="30" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">AAA and wireless</text><text x="600" y="670" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  RADIUS device logins</text><text x="600" y="708" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  Wireless LAN controller</text><text x="600" y="746" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  802.1X concepts</text><rect x="1080" y="520" width="460" height="290" rx="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="2"/><text x="1110" y="572" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#5F5E5A" text-anchor="start" font-weight="700" xml:space="preserve">Lab 6</text><text x="1110" y="614" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="30" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">Multi-vendor routing</text><text x="1110" y="670" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  Cisco, Juniper, MikroTik</text><text x="1110" y="708" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  OSPF and BGP interop</text><text x="1110" y="746" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">•  Route redistribution</text></svg>