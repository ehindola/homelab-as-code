<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"><title>Troubleshooting: no default route on CORE</title><desc>Before the fix, R1 used a /30 mask and CORE used a /24 mask on the same link, so OSPF formed no adjacency. After correcting CORE to /30, CORE learned the default route.</desc><defs></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#FBFAF7"/><text x="60" y="78" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="42" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">Troubleshooting: no default route on CORE</text><text x="60" y="118" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#5F5E5A" text-anchor="start" font-weight="400" xml:space="preserve">OSPF neighbours need matching subnet masks</text><line x1="60" y1="142" x2="1540" y2="142" stroke="#D3D1C7" stroke-width="1.5"/><text x="60" y="872" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#888780" text-anchor="start" font-weight="400" xml:space="preserve">Lab 1 · Campus network · built in EVE-NG</text><rect x="60" y="190" width="720" height="440" rx="16" fill="#FFFFFF" stroke="#A32D2D" stroke-width="2"/><rect x="84" y="170" width="113" height="40" rx="20.0" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/><text x="140.5" y="195" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#501313" text-anchor="middle" font-weight="700" xml:space="preserve">Before</text><rect x="110" y="250" width="270" height="96" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="245.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">R1</text><text x="245.0" y="322.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">e0/1 10.10.0.1 /30</text><rect x="460" y="250" width="270" height="96" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="2"/><text x="595.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#501313" text-anchor="middle" font-weight="700" xml:space="preserve">CORE</text><text x="595.0" y="322.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#A32D2D" text-anchor="middle" font-weight="400" xml:space="preserve">e0/0 10.10.0.2 /24</text><path d="M380 298 L460 298" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><rect x="90" y="376" width="660" height="117" rx="10" fill="#2C2C2A"/><text x="112" y="414" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">CORE# show ip route</text><text x="112" y="443" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">Gateway of last resort is not set</text><text x="112" y="472" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">C  10.10.0.0/24 is directly connected, Et0/0</text><text x="90" y="540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">The hello packets carry each side&#x27;s mask. They</text><text x="90" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">differ, so the routers never become neighbours.</text><rect x="820" y="190" width="720" height="440" rx="16" fill="#FFFFFF" stroke="#3B6D11" stroke-width="2"/><rect x="844" y="170" width="100" height="40" rx="20.0" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/><text x="894.0" y="195" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" fill="#173404" text-anchor="middle" font-weight="700" xml:space="preserve">After</text><rect x="870" y="250" width="270" height="96" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/><text x="1005.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#26215C" text-anchor="middle" font-weight="700" xml:space="preserve">R1</text><text x="1005.0" y="322.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#534AB7" text-anchor="middle" font-weight="400" xml:space="preserve">e0/1 10.10.0.1 /30</text><rect x="1220" y="250" width="270" height="96" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="2"/><text x="1355.0" y="294.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#173404" text-anchor="middle" font-weight="700" xml:space="preserve">CORE</text><text x="1355.0" y="322.0" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#3B6D11" text-anchor="middle" font-weight="400" xml:space="preserve">e0/0 10.10.0.2 /30</text><path d="M1140 298 L1220 298" fill="none" stroke="#444441" stroke-width="2.5" stroke-linejoin="round"/><rect x="850" y="376" width="660" height="117" rx="10" fill="#2C2C2A"/><text x="872" y="414" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">CORE# show ip route</text><text x="872" y="443" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">Gateway of last resort is 10.10.0.1</text><text x="872" y="472" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">O*E2 0.0.0.0/0 [110/1] via 10.10.0.1</text><text x="850" y="540" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">Masks match, the adjacency forms, and CORE</text><text x="850" y="568" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">learns the default route that R1 advertises.</text><text x="60" y="690" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="22" fill="#2C2C2A" text-anchor="start" font-weight="700" xml:space="preserve">How it was found</text><text x="60" y="724" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">CORE&#x27;s routing table showed the R1 link as</text><text x="60" y="752" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="19" fill="#2C2C2A" text-anchor="start" font-weight="400" xml:space="preserve">10.10.0.0/24, where the design called for /30.</text><rect x="820" y="668" width="720" height="90" rx="10" fill="#2C2C2A"/><text x="842" y="706" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">CORE(config)# interface e0/0</text><text x="842" y="736" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="19" fill="#F1EFE8" text-anchor="start" font-weight="400" xml:space="preserve">CORE(config-if)# ip address 10.10.0.2 255.255.255.252</text></svg>