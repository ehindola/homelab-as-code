! CORE - layer 3 switch (Cisco IOL L2)
hostname CORE
!
ip routing
!
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 99
 name MGMT
!
interface Ethernet0/0
 description To R1 e0/1
 no switchport
 ip address 10.10.0.2 255.255.255.252
 no shutdown
!
interface Ethernet0/1
 description Trunk to ACC1 e0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Ethernet0/2
 description Trunk to ACC2 e0/0
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface Vlan10
 description Gateway USERS
 ip address 10.10.10.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description Gateway SERVERS
 ip address 10.10.20.1 255.255.255.0
 no shutdown
!
interface Vlan99
 description Gateway MGMT
 ip address 10.10.99.1 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 network 10.10.0.0 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.99.0 0.0.0.255 area 0
 passive-interface Vlan10
 passive-interface Vlan20
 passive-interface Vlan99
!
end
