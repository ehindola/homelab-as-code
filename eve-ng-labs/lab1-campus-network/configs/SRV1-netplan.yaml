# /etc/netplan/01-lab.yaml on SRV1 (Ubuntu Server 24.04)
# Apply with: sudo netplan apply
network:
  version: 2
  ethernets:
    ens3:
      dhcp4: false
      addresses: [10.10.20.10/24]
      routes:
        - to: default
          via: 10.10.20.1
      nameservers:
        addresses: [8.8.8.8, 1.1.1.1]
